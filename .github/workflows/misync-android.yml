name: MISync Android

on:
  push:
    paths:
      - "MISync/**"
      - ".github/workflows/misync-android.yml"
  pull_request:
    paths:
      - "MISync/**"
      - ".github/workflows/misync-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MISync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify the APK requests no network permissions
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)" permissions.txt; then
            echo "::error::Network permission found in merged manifest"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: misync-debug
          path: |
            MISync/app/build/outputs/apk/debug/*.apk
            MISync/app/build/reports/tests/
          if-no-files-found: warn

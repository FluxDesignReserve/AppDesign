name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Offline guard (app code must not use the network)
        run: |
          if grep -rnE 'URLSession|URLRequest|NWConnection|NWPathMonitor|WKWebView|https?://' ConciseEnglish --include='*.swift'; then
            echo "::error::Network APIs or URLs found in app code; Concise English must work fully offline."
            exit 1
          fi

      - name: Xcode version
        run: xcodebuild -version

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [(rt, d) for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          ios.sort(key=lambda x: x[0])
          print(ios[-1][1]["udid"])
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ConciseEnglish.xcodeproj \
            -scheme ConciseEnglish \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E 'error:|warning:|Test Case|Executed|\*\* (BUILD|TEST)' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' xcodebuild.log

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log

name: Polarsync (Android)

on:
  push:
    paths:
      - "polarsync/**"
      - ".github/workflows/polarsync-android.yml"
  pull_request:
    paths:
      - "polarsync/**"
      - ".github/workflows/polarsync-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polarsync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polarsync-debug
          path: |
            polarsync/app/build/outputs/apk/debug/*.apk
            polarsync/app/build/reports/
          if-no-files-found: ignore

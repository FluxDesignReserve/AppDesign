<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Rook</title>
<style>
  :root {
    --plate: #ffffff;
    --ink: #231f20;
    --edge: #a4a4ac;
    --lo: #dcdce1;
    --bg: #f6f6f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --plate: #08090a;
      --ink: #d0d6e0;
      --edge: #5b5d64;
      --lo: #2c2c31;
      --bg: #000000;
    }
  }
  :root[data-theme="dark"] {
    --plate: #08090a;
    --ink: #d0d6e0;
    --edge: #5b5d64;
    --lo: #2c2c31;
    --bg: #000000;
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    padding: 16px;
    box-sizing: border-box;
  }
  .stage {
    width: min(640px, 100%);
    aspect-ratio: 5 / 4;
    background: var(--plate);
    border-radius: 12px;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage svg { display: block; width: 100%; height: 100%; }

  /* Hairline drawing: plates filled with the ground colour, painted back to front. */
  .sil, .lid { fill: var(--plate); vector-effect: non-scaling-stroke; stroke-width: 1.2; stroke-linejoin: round; stroke-linecap: round; transition: stroke 260ms cubic-bezier(.5,0,.1,1); }
  .sil { stroke: var(--edge); }
  .lid { stroke: var(--lo); fill: none; }
  .hi .sil, .sil.hi, .stroke.hi { stroke: var(--ink); }
  .stroke { fill: none; stroke: var(--edge); stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; transition: stroke 260ms cubic-bezier(.5,0,.1,1); }

  /* Block cursor */
  .cursor .sil { animation: cursor 1.1s steps(1) infinite; }
  @keyframes cursor { 0%, 55% { fill: var(--ink); } 56%, 100% { fill: var(--plate); } }

  /* Rook icon, drawn flat on the coin's face */
  .ink { fill: var(--ink); stroke: none; }
  .paper { fill: var(--plate); stroke: none; }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 6s ease-in-out infinite; }
  @keyframes blink {
    0%, 40%, 44%, 86%, 89%, 92%, 95%, 100% { transform: scaleY(1); }
    42%, 87.5%, 93.5% { transform: scaleY(.1); }
  }
  .glint { animation: glint 6s ease-in-out infinite; }
  @keyframes glint {
    0%, 40%, 44%, 86%, 95%, 100% { opacity: 1; }
    41.5%, 42.5%, 87%, 94% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor .sil, .blink, .glint { animation: none; }
  }
</style>
</head>
<body>
<div class="stage" id="stage" role="img" aria-label="A terminal window drawn in isometric hairline. Its output scrolls and the line under the pointer lifts off the glass. A rook coin stands in front of it, watching the lifted line and blinking.">
  <svg viewBox="0 0 400 320" aria-hidden="true" id="svg"></svg>
</div>
<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("svg");
  const stage = document.getElementById("stage");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");

  /* ---------- camera ----------
   * Orthographic, 45° azimuth, sin(elevation) = .5 (the 2:1 view).
   * World: x/y on the ground, z up. The terminal stands in the x–z plane facing +y,
   * so it is drawn in its own frame: u across, v up, w out of the face. */
  const AZ = Math.PI / 4, K = 0.5, ZF = Math.sqrt(1 - K * K), S = 1.62;
  const CA = Math.cos(AZ), SA = Math.sin(AZ);
  let OX = 0, OY = 0;
  const P = (x, y, z) => { const X = x * CA - y * SA, Y = x * SA + y * CA; return [OX + S * X, OY + S * (Y * K - z * ZF)]; };
  const F = (u, v, w) => P(u, w, v);

  /* ---------- geometry helpers ---------- */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (t) => t * t * (3 - 2 * t);
  const r2 = (n) => Math.round(n * 100) / 100;
  const path = (pts, close = true) => pts.length < 2 ? "" : "M" + pts.map((p) => r2(p[0]) + " " + r2(p[1])).join("L") + (close ? "Z" : "");

  /** A rounded rectangle in the face plane, as points. */
  function rrect(u0, v0, u1, v1, r, n = 5) {
    r = Math.max(0, Math.min(r, (u1 - u0) / 2, (v1 - v0) / 2));
    const out = [];
    const corners = [[u1 - r, v1 - r, 0], [u0 + r, v1 - r, 90], [u0 + r, v0 + r, 180], [u1 - r, v0 + r, 270]];
    for (const [cu, cv, a0] of corners)
      for (let k = 0; k <= n; k++) {
        const a = (a0 + (90 * k) / n) * Math.PI / 180;
        out.push([cu + r * Math.cos(a), cv + r * Math.sin(a)]);
      }
    return out;
  }
  const disc = (cu, cv, R, n = 72) => Array.from({ length: n }, (_, k) => {
    const a = (k / n) * Math.PI * 2;
    return [cu + R * Math.cos(a), cv + R * Math.sin(a)];
  });

  /** Convex hull, monotone chain. */
  function hull(input) {
    const pts = input.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const p of pts) { while (lo.length > 1 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length > 1 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    lo.pop(); up.pop();
    return lo.concat(up);
  }

  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  /** A slab extruded out of the face from w0 to w1: its silhouette, and its front face's outline. */
  function solid(parent, cls = "") {
    const g = el("g", cls ? { class: cls } : {}, parent);
    return { g, sil: el("path", { class: "sil" }, g), lid: el("path", { class: "lid" }, g) };
  }
  function draw(s, outline, w0, w1) {
    const back = outline.map(([u, v]) => F(u, v, w0)), front = outline.map(([u, v]) => F(u, v, w1));
    s.sil.setAttribute("d", path(hull(back.concat(front))));
    s.lid.setAttribute("d", path(front));
  }
  const hide = (s) => { s.sil.setAttribute("d", ""); s.lid.setAttribute("d", ""); };

  /* ---------- springs ---------- */
  const spring = (x, k = 100, c = 18) => ({ x, v: 0, t: x, k, c });
  function step(sp, dt) {
    if (reduced.matches) { sp.x = sp.t; sp.v = 0; return; }
    const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
    for (let i = 0; i < n; i++) { sp.v += (-sp.k * (sp.x - sp.t) - sp.c * sp.v) * h; sp.x += sp.v * h; }
  }

  /* ---------- the terminal ---------- */
  const W = 150, PB = 17, TB = 17, ROWS = 7, PITCH = 11, HALF = 2.1, DEPTH = 1.8, CELL = 3.9;
  const LIFT = 5.5, BAR = 3.4, SLAB = 3, PAD = 11, INSET = 2.5, EDGE = 4;
  const VB = PB, VA = PB + ROWS * PITCH, H = VA + TB;

  /** Output history, oldest first: [indent, ...token lengths], in cells. */
  const HIST = [
    [0, 6, 10], [2, 8, 4, 7], [2, 15], [4, 5, 11], [4, 19], [2, 4], [0, 3], [0, 3, 7, 6],
    [0, 24], [0, 18], [0, 10, 5], [2, 8, 13], [2, 6, 4, 6], [4, 15], [4, 9, 7], [2, 5],
    [0, 4, 12], [0, 22], [0, 28], [0, 16], [2, 7, 10], [2, 12], [0, 8, 6], [0, 5, 8],
  ];
  const N = HIST.length, MAXTOP = N - ROWS;
  const REST_TOP = MAXTOP - 2.6, REST_LINE = 18, SPREAD = 2;

  /* ---------- the rook coin ---------- */
  const COIN = { u: 132, v: 14, R: 31, w0: 12, w1: 15.5 };
  const ICON = { x: 82, y: 128, r: 24 }; // the source icon's centre and outer radius

  // Frame the drawing: centre the bounds of everything that can show.
  (() => {
    const pts = [];
    for (const w of [-SLAB, LIFT + DEPTH]) for (const [u, v] of [[0, 0], [W, 0], [0, H], [W, H]]) pts.push(F(u, v, w));
    for (const [u, v] of disc(COIN.u, COIN.v, COIN.R, 24)) pts.push(F(u, v, COIN.w0), F(u, v, COIN.w1));
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    OX = 200 - (Math.min(...xs) + Math.max(...xs)) / 2;
    OY = 160 - (Math.min(...ys) + Math.max(...ys)) / 2;
  })();

  const root = el("g", {}, svg);
  draw(solid(root), rrect(0, 0, W, H, 9), -SLAB, 0);

  const rowsG = el("g", {}, root);
  const rows = HIST.map(([indent, ...tokens], j) => {
    const g = el("g", {}, rowsG), segs = [];
    let at = indent;
    for (const n of tokens) {
      const u0 = PAD + at * CELL;
      segs.push({ u0, u1: u0 + n * CELL - 1.4, s: solid(g) });
      at += n + 1;
    }
    const u0 = segs[0].u0, u1 = segs[segs.length - 1].u1;
    return { j, g, segs, mid: (u0 + u1) / 2, lift: spring(0) };
  });

  // Prompt bar (painted after the rows, so new lines rise from behind it).
  const cy = (INSET + VB) / 2;
  draw(solid(root), rrect(INSET, INSET, W - INSET, VB, 6), 0, BAR);
  const chevron = el("path", {
    class: "stroke",
    d: path([[PAD, cy + 5.4], [PAD + 7.5, cy], [PAD, cy - 5.4]].map(([u, v]) => F(u, v, BAR)), false),
  }, root);
  const cursor = solid(root, "cursor");
  draw(cursor, rrect(PAD + 13, cy - 5.2, PAD + 13 + CELL * 1.5, cy + 5.2, 1.2), BAR, BAR + 2.6);

  // Title bar and its three buttons (painted after the rows, so old lines pass behind it).
  draw(solid(root), rrect(INSET, VA, W - INSET, H - INSET, 6), 0, BAR);
  for (let i = 0; i < 3; i++) draw(solid(root), disc(PAD + i * 8.5, (VA + H - INSET) / 2, 2.8, 32), BAR, BAR + 1.3);

  // The coin: an upright disc parallel to the terminal, with the rook drawn flat on its face.
  const coinG = el("g", {}, root);
  const coin = solid(coinG);
  const face = el("g", {}, coinG);
  face.innerHTML = `
    <circle class="ink" cx="82" cy="128.375" r="20.25"/>
    <path class="paper" d="M90.1818 134.025V134.783C90.1818 135.047 89.965 135.265 89.7032 135.265H82H74.2968C74.0309 135.265 73.8181 135.047 73.8181 134.783V134.025C73.8181 133.192 74.4891 132.514 75.3195 132.514H75.4136L75.6836 130.704L75.8145 129.821L75.8677 129.473L76.5427 125.109C76.6081 124.682 76.3013 124.255 75.8718 124.259C75.4545 124.259 75.1231 123.89 75.1927 123.455C75.2459 123.116 75.5609 122.881 75.9004 122.881H76.5713V121.507H76.2031C75.6386 121.507 75.1804 121.042 75.1804 120.473V117.034C75.1804 116.461 75.6386 116 76.2031 116H76.8863C77.4509 116 77.9091 116.461 77.9091 117.034C77.9091 117.608 78.3672 118.065 78.9318 118.065C79.4963 118.065 79.9545 117.604 79.9545 117.034C79.9545 116.465 80.4127 116 80.9772 116H83.0227C83.5872 116 84.0454 116.461 84.0454 117.034C84.0454 117.608 84.5036 118.065 85.0681 118.065C85.6327 118.065 86.0909 117.604 86.0909 117.034C86.0909 116.465 86.5491 116 87.1136 116H87.7968C88.3613 116 88.8195 116.461 88.8195 117.034V120.473C88.8195 121.042 88.3613 121.507 87.7968 121.507H87.4532V122.881H88.0995C88.4391 122.881 88.7541 123.116 88.8072 123.455C88.8768 123.89 88.5454 124.263 88.1281 124.259C87.6986 124.255 87.3918 124.682 87.4572 125.109L88.5945 132.438C88.5986 132.48 88.6354 132.514 88.6804 132.514C89.5109 132.514 90.1818 133.192 90.1818 134.025Z"/>
    <path class="paper" d="M73 137.487C73 137.025 73.3663 136.65 73.8182 136.65H82H90.1818C90.6337 136.65 91 137.025 91 137.487V139.162C91 139.625 90.6337 140 90.1818 140H82H73.8182C73.3663 140 73 139.625 73 139.162V137.487Z"/>
    <g id="look"><g class="blink">
      <path class="ink" d="M78.3962 123.876C78.3962 123.212 78.934 122.674 79.5975 122.674C80.2609 122.674 80.7987 123.212 80.7987 123.876V126.278C80.7987 126.941 80.2609 127.479 79.5975 127.479C78.934 127.479 78.3962 126.941 78.3962 126.278V123.876Z"/>
      <path class="ink" d="M83.2011 123.876C83.2011 123.212 83.7389 122.674 84.4023 122.674C85.0657 122.674 85.6035 123.212 85.6035 123.876V126.278C85.6035 126.941 85.0657 127.479 84.4023 127.479C83.7389 127.479 83.2011 126.941 83.2011 126.278V123.876Z"/>
      <g class="glint">
        <circle class="paper" cx="79.1973" cy="123.876" r="0.4"/>
        <circle class="paper" cx="84.0021" cy="123.876" r="0.4"/>
      </g>
    </g></g>`;
  const look = face.querySelector("#look");

  function drawCoin(bob) {
    const cu = COIN.u, cv = COIN.v + bob;
    draw(coin, disc(cu, cv, COIN.R), COIN.w0, COIN.w1);
    // Icon space (x right, y down) onto the coin's front face: one affine map, exact under an orthographic camera.
    const s = COIN.R / ICON.r, o = F(cu, cv, COIN.w1), a = F(cu + 1, cv, COIN.w1), b = F(cu, cv - 1, COIN.w1);
    const m = [s * (a[0] - o[0]), s * (a[1] - o[1]), s * (b[0] - o[0]), s * (b[1] - o[1]), o[0], o[1]].map((n) => n.toFixed(4));
    face.setAttribute("transform", `matrix(${m.join(" ")}) translate(${-ICON.x} ${-ICON.y})`);
  }

  /* ---------- state ---------- */
  const top = spring(REST_TOP, 100, 18);
  const eyeX = spring(0, 70, 14), eyeY = spring(0, 70, 14);
  let lit = null;

  /** over: null (rest), "prompt", or 0…1 down the history. */
  function target(over) {
    let t, c, spread = SPREAD;
    if (over === null) { t = REST_TOP; c = REST_LINE; }
    else if (over === "prompt") { t = MAXTOP; c = -1; }
    else {
      t = over * MAXTOP;
      c = clamp(Math.round(over * (N - 1)), Math.ceil(t), Math.floor(t + ROWS - 1));
    }
    top.t = t;
    for (const r of rows) r.lift.t = c < 0 ? 0 : LIFT * clamp(1 - Math.abs(r.j - c) / spread, 0, 1);
    const want = c < 0 ? "prompt" : c;
    if (want !== lit) {
      if (lit === "prompt") { chevron.classList.remove("hi"); cursor.sil.classList.remove("hi"); }
      else if (lit !== null) rows[lit].g.classList.remove("hi");
      if (want === "prompt") { chevron.classList.add("hi"); cursor.sil.classList.add("hi"); }
      else rows[want].g.classList.add("hi");
      lit = want;
    }
    return c;
  }

  // Where the rook looks: at the lifted line, or the prompt, in the coin's own plane.
  function aim(c) {
    let du, dv;
    if (c < 0) { du = PAD + 10 - COIN.u; dv = cy - COIN.v; }
    else { du = rows[c].mid - COIN.u; dv = VA - (c - top.t + 0.5) * PITCH - COIN.v; }
    const len = Math.hypot(du, dv) || 1;
    eyeX.t = 1.15 * du / len;
    eyeY.t = -0.75 * dv / len; // icon y runs down
  }

  function drawRows() {
    for (const r of rows) {
      const vc = VA - (r.j - top.x + 0.5) * PITCH;
      const v0 = Math.max(vc - HALF, VB), v1 = Math.min(vc + HALF, VA);
      // Lines ease back onto the glass as they near either bar.
      const env = smooth(clamp((VA - vc - HALF) / EDGE, 0, 1)) * smooth(clamp((vc - HALF - VB) / EDGE, 0, 1));
      const w0 = r.lift.x * env;
      for (const sg of r.segs) {
        if (v1 - v0 < 0.05) { hide(sg.s); continue; }
        const ring = rrect(sg.u0, vc - HALF, sg.u1, vc + HALF, HALF, 4).map(([u, v]) => [u, clamp(v, VB, VA)]);
        draw(sg.s, ring, w0, w0 + DEPTH);
      }
    }
  }

  /* ---------- pointer ---------- */
  let pointerOver = undefined; // undefined: autoplay. null/"prompt"/number: the pointer is driving.
  let leaveTimer = 0, idleSince = 0;

  function onFace(sx, sy, w) {
    const o = F(0, 0, w), a = F(1, 0, w), b = F(0, 1, w);
    const ax = a[0] - o[0], ay = a[1] - o[1], bx = b[0] - o[0], by = b[1] - o[1], det = ax * by - ay * bx;
    return [((sx - o[0]) * by - (sy - o[1]) * bx) / det, (ax * (sy - o[1]) - ay * (sx - o[0])) / det];
  }
  function hit(e) {
    const r = stage.getBoundingClientRect();
    const sx = ((e.clientX - r.left) / r.width) * 400, sy = ((e.clientY - r.top) / r.height) * 320;
    const [u, v] = onFace(sx, sy, 0);
    if (u < 0 || u > W || v < 0 || v > H) return null;
    if (v <= VB) return "prompt";
    return clamp((VA - PITCH / 2 - v) / ((ROWS - 1) * PITCH), 0, 1);
  }
  stage.addEventListener("pointermove", (e) => { clearTimeout(leaveTimer); pointerOver = hit(e); });
  stage.addEventListener("pointerdown", (e) => {
    clearTimeout(leaveTimer);
    if (e.pointerType !== "mouse") stage.releasePointerCapture?.(e.pointerId);
    pointerOver = hit(e);
  });
  stage.addEventListener("pointerleave", (e) => {
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => { pointerOver = null; idleSince = performance.now(); setTimeout(() => { if (pointerOver === null) { pointerOver = undefined; clock = 0; } }, 1500); }, e.pointerType === "mouse" ? 0 : 1400);
  });

  /* ---------- autoplay: rest, scrub the history, visit the prompt, rest ---------- */
  const SCRUB = 7, PROMPT = 1.8, REST = 2.6, CYCLE = 1.2 + SCRUB + PROMPT + REST;
  let clock = 0;
  function autoplay(t) {
    t %= CYCLE;
    if (t < 1.2) return null;
    t -= 1.2;
    if (t < SCRUB) return 0.5 + 0.42 * Math.cos((2 * Math.PI * t) / SCRUB);
    t -= SCRUB;
    return t < PROMPT ? "prompt" : null;
  }

  /* ---------- frame loop ---------- */
  let last = performance.now(), visible = true, raf = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    clock += dt;
    const over = pointerOver !== undefined ? pointerOver : reduced.matches ? null : autoplay(clock);
    const c = target(over);
    step(top, dt);
    for (const r of rows) step(r.lift, dt);
    if (c === REST_LINE && over === null) { eyeX.t = 0; eyeY.t = 0; } else aim(c);
    step(eyeX, dt); step(eyeY, dt);
    look.setAttribute("transform", `translate(${eyeX.x.toFixed(3)} ${eyeY.x.toFixed(3)})`);
    drawRows();
    drawCoin(reduced.matches ? 0 : 0.9 * Math.sin((now / 4000) * Math.PI * 2));
    raf = visible ? requestAnimationFrame(frame) : 0;
  }
  new IntersectionObserver(([e]) => {
    visible = e.isIntersecting;
    if (visible && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  }).observe(stage);
  // Draw once now, so the figure is there before the first frame.
  for (const r of rows) r.lift.x = r.lift.t = LIFT * clamp(1 - Math.abs(r.j - REST_LINE) / SPREAD, 0, 1);
  target(null); drawRows(); drawCoin(0);
})();
</script>
</body>
</html>

<svg width="250" height="164" viewBox="0 0 250 164" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  /* Shared */
  .a { transform-box: fill-box; transform-origin: center; }

  /* Window traffic-light dots: soft sequential pulse */
  .dot { animation: dotPulse 3.6s ease-in-out infinite; }
  .dot-2 { animation-delay: .25s; }
  .dot-3 { animation-delay: .5s; }
  @keyframes dotPulse {
    0%, 30%, 100% { opacity: 1; transform: scale(1); }
    12% { opacity: .55; transform: scale(.82); }
  }

  /* Code bars: gentle staggered shimmer */
  .bar { animation: barShimmer 4.8s ease-in-out infinite; }
  @keyframes barShimmer {
    0%, 60%, 100% { opacity: 1; }
    30% { opacity: .45; }
  }

  /* Line-number "1": soft blink like a caret */
  .linenum { animation: caret 2.4s steps(1) infinite; }
  @keyframes caret { 0%, 70% { opacity: 1; } 71%, 100% { opacity: .35; } }

  /* Rook avatar: gentle float */
  .rook { animation: rookFloat 4s ease-in-out infinite; }
  @keyframes rookFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.2px); }
  }
  .ring { animation: ringBreath 4s ease-in-out infinite; }
  @keyframes ringBreath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }

  /* Rook eyes: look around + blink */
  .eyes-look { animation: eyesLook 6s ease-in-out infinite; }
  @keyframes eyesLook {
    0%, 12%   { transform: translate(0, 0); }
    18%, 34%  { transform: translate(-1.1px, 0); }
    40%, 56%  { transform: translate(1.1px, -0.3px); }
    62%, 78%  { transform: translate(0.4px, 0.5px); }
    84%, 100% { transform: translate(0, 0); }
  }
  .eyes-blink { transform-origin: 82px 125.08px; animation: eyesBlink 6s ease-in-out infinite; }
  @keyframes eyesBlink {
    0%, 9%, 13%, 86%, 89%, 92%, 95%, 100% { transform: scaleY(1); }
    11%, 87.5%, 93.5% { transform: scaleY(.1); }
  }
  .glint { animation: glint 6s ease-in-out infinite; }
  @keyframes glint {
    0%, 9%, 13%, 86%, 95%, 100% { opacity: 1; }
    10.5%, 11.5%, 87%, 94% { opacity: 0; }
  }

  /* Ball: bob + slow roll */
  .ball { animation: ballBob 2.8s ease-in-out infinite; }
  @keyframes ballBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .ball-spin { transform-origin: 193.57px 107.49px; animation: ballSpin 9s linear infinite; }
  @keyframes ballSpin { to { transform: rotate(360deg); } }

  /* Arrow: nudge to the left (direction it points) */
  .arrow { animation: arrowNudge 2.4s ease-in-out infinite; }
  @keyframes arrowNudge {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-3px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>

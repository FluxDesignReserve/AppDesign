# XcodeGen spec. Run `xcodegen generate` in this folder to create Polarsync.xcodeproj.
name: Polarsync
options:
  bundleIdPrefix: io.github.polarsync
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Change this if Xcode says the identifier is already taken (see README).
    POLARSYNC_BUNDLE_ID: io.github.polarsync

targets:
  # Pure logic: file format, PIN hashing and lockout, formatting. Covered by unit tests.
  PolarsyncCore:
    type: framework
    platform: iOS
    sources: [PolarsyncCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POLARSYNC_BUNDLE_ID).core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  PolarsyncCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PolarsyncCoreTests]
    dependencies:
      - target: PolarsyncCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POLARSYNC_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

  Polarsync:
    type: application
    platform: iOS
    sources:
      - Polarsync
      - Shared
    dependencies:
      - target: PolarsyncCore
      - target: PolarsyncWidgets
    settings:
      base:
        PRODUCT_NAME: Polarsync
        PRODUCT_BUNDLE_IDENTIFIER: $(POLARSYNC_BUNDLE_ID)
        INFOPLIST_FILE: Config/Polarsync-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  # Live Activity (Lock Screen + Dynamic Island) with Pause/Resume/Stop buttons.
  PolarsyncWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PolarsyncWidgets
      - Shared
    settings:
      base:
        PRODUCT_NAME: PolarsyncWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(POLARSYNC_BUNDLE_ID).widgets
        INFOPLIST_FILE: Config/PolarsyncWidgets-Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  Polarsync:
    build:
      targets:
        Polarsync: all
        PolarsyncCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PolarsyncCoreTests]
      gatherCoverageData: true
    archive:
      config: Release
